<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Głęboka Relaksacja i Hipnoza</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10, 10, 10, 0.72);
      --border: rgba(255,255,255,0.2);
      --text: #f4f4f4;
      --muted: #bdbdbd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: #000;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 1rem;
      pointer-events: none;
    }

    .panel {
      width: min(560px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      padding: clamp(1rem, 2.2vw, 2rem);
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 14px 48px rgba(0,0,0,0.45);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    p {
      margin: 0.45rem 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.1rem;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.72rem 1.1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px); }

    .btn-start { background: #fff; color: #000; }
    .btn-stop { background: #2b2b2b; color: #fff; border: 1px solid #4e4e4e; }

    .hint {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      opacity: 0.92;
    }

    .status {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: #dbdbdb;
      min-height: 1.2em;
    }

    .tracker {
      position: fixed;
      z-index: 1;
      width: 42px;
      height: 76px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: filter .2s linear;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.45));
    }

    .tracker::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px 24px 18px 18px;
      background: linear-gradient(180deg, #f8d8bd, #dcad8d 72%);
      border: 2px solid rgba(0,0,0,0.3);
    }

    .tracker::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: -16px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: radial-gradient(circle at 40% 35%, #ffe7d4, #d09a7a);
      border: 2px solid rgba(0,0,0,0.28);
    }
  </style>
</head>
<body>
  <canvas id="hypno"></canvas>
  <div id="tracker" class="tracker" aria-hidden="true"></div>

  <div class="overlay">
    <section class="panel">
      <h1>Głęboka relaksacja i hipnoza</h1>
      <p>W tle działa czarno-białe koło hipnotyczne.</p>
      <p>Patrz i podążaj wzrokiem za poruszającym się wskaźnikiem falusa.</p>
      <p>Włącz dźwięk, aby uruchomić ambient prowadzący w spokojny stan.</p>

      <div class="controls">
        <button id="startBtn" class="btn-start">Start sesji</button>
        <button id="stopBtn" class="btn-stop">Stop audio</button>
      </div>

      <p class="hint">Najlepiej używać słuchawek i spokojnie oddychać przez 2–5 minut.</p>
      <div id="status" class="status"></div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById('hypno');
    const ctx = canvas.getContext('2d');
    const tracker = document.getElementById('tracker');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    let width = 0;
    let height = 0;
    let t = 0;
    let audioCtx;
    let masterGain;
    let audioNodes = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    function drawHypno(time) {
      t = time * 0.001;
      const cx = width / 2;
      const cy = height / 2;
      const maxR = Math.hypot(width, height) * 0.62;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < 160; i++) {
        const ratio = i / 160;
        const r = ratio * maxR;
        const a1 = ratio * 38 + t * 1.75;
        const a2 = a1 + Math.PI * 0.5;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, a1, a2);
        ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
        ctx.fill();
      }

      const orbit = Math.min(width, height) * 0.28;
      const x = cx + Math.cos(t * 1.35) * orbit;
      const y = cy + Math.sin(t * 1.35) * orbit;
      tracker.style.left = `${x}px`;
      tracker.style.top = `${y}px`;
      tracker.style.transform = `translate(-50%, -50%) rotate(${Math.sin(t * 1.35) * 18}deg)`;

      requestAnimationFrame(drawHypno);
    }

    requestAnimationFrame(drawHypno);

    function setStatus(message) {
      status.textContent = message;
    }

    async function startAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      stopAudio();

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      masterGain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 2.8);
      masterGain.connect(audioCtx.destination);

      const left = audioCtx.createOscillator();
      const right = audioCtx.createOscillator();
      const drone = audioCtx.createOscillator();

      const leftPan = audioCtx.createStereoPanner();
      const rightPan = audioCtx.createStereoPanner();

      const leftGain = audioCtx.createGain();
      const rightGain = audioCtx.createGain();
      const droneGain = audioCtx.createGain();

      left.type = 'sine';
      right.type = 'sine';
      drone.type = 'triangle';

      left.frequency.value = 200;
      right.frequency.value = 206;
      drone.frequency.value = 80;

      leftPan.pan.value = -0.72;
      rightPan.pan.value = 0.72;

      leftGain.gain.value = 0.18;
      rightGain.gain.value = 0.18;
      droneGain.gain.value = 0.08;

      left.connect(leftPan).connect(leftGain).connect(masterGain);
      right.connect(rightPan).connect(rightGain).connect(masterGain);
      drone.connect(droneGain).connect(masterGain);

      left.start();
      right.start();
      drone.start();

      audioNodes = [left, right, drone];
      setStatus('Audio aktywne: binauralny ambient uruchomiony.');
    }

    function stopAudio() {
      if (!audioCtx || !audioNodes.length) return;

      const now = audioCtx.currentTime;
      if (masterGain) {
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
      }

      audioNodes.forEach(node => {
        try { node.stop(now + 0.8); } catch (_) {}
      });

      audioNodes = [];
      setStatus('Audio zatrzymane. Możesz uruchomić ponownie.');
    }

    startBtn.addEventListener('click', async () => {
      try {
        await startAudio();
      } catch (err) {
        setStatus('Nie udało się uruchomić audio. Sprawdź uprawnienia przeglądarki.');
      }
    });

    stopBtn.addEventListener('click', stopAudio);
  </script>
</body>
</html>
