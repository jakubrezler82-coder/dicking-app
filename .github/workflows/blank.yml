<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicking - Neuro-Aesthetic Well-being</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; color: #fff;
            font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;
        }
        
        canvas { display: block; position: fixed; inset: 0; z-index: 1; }
        
        .screen { 
            position: fixed; inset: 0; z-index: 50; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 1.5rem; transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s; 
            background: rgba(0,0,0,0.92);
        }
        
        .hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .glass { 
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(30px); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; 
            max-width: 550px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        
        .btn-action { 
            background: #fff; color: #000; font-weight: 900; 
            padding: 1rem 2rem; border-radius: 9999px; 
            text-transform: uppercase; letter-spacing: 0.1em; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; display: inline-block;
        }
        
        .btn-action:hover { background: #8b5cf6; color: #fff; transform: scale(1.05); box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); }
        
        .option-card { 
            border: 1px solid rgba(255,255,255,0.1); padding: 1rem; 
            border-radius: 1.25rem; cursor: pointer; transition: all 0.2s; 
            text-align: center; font-size: 0.875rem;
        }
        
        .option-card:hover { background: rgba(139, 92, 246, 0.15); border-color: #8b5cf6; }
        .option-card.selected { background: #8b5cf6; border-color: #a78bfa; color: white; transform: translateY(-2px); }
        
        #progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 1.5rem; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #8b5cf6; transition: width 1s linear; }
        
        .sci-label { font-size: 0.6rem; color: rgba(255, 255, 255, 0.3); text-transform: uppercase; letter-spacing: 0.2em; text-align: center; }
        
        #session-exit {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            z-index: 60; opacity: 0; pointer-events: none; transition: opacity 1s;
        }
    </style>
</head>
<body>

    <canvas id="hypnoCanvas"></canvas>

    <!-- 1. POWITANIE I EDUKACJA -->
    <div id="screen-welcome" class="screen">
        <div class="glass p-8 md:p-12 text-center border border-purple-500/20">
            <h1 class="text-5xl font-black italic uppercase tracking-widest mb-6 leading-none">Dicking</h1>
            <h2 class="text-lg font-bold text-purple-400 mb-6 text-left">Neuro-Aesthetic Well-being</h2>
            <div class="text-sm text-gray-400 text-left space-y-4 leading-relaxed mb-10 overflow-y-auto max-h-[40vh] pr-2">
                <p>Relaksacja to nie tylko brak stresu – to aktywny proces biologiczny niezbędny dla regeneracji Twojego mózgu. Aplikacja <strong>Dicking</strong> została zaprojektowana, aby wywołać tzw. <em>Response Relaxation</em>.</p>
                <p>Wykorzystujemy <strong>fiksację wzroku</strong> (James Braid, 1843), która poprzez zmęczenie mięśni gałki ocznej ułatwia przejście w stan transu. Tło oparte na <strong>adaptacji kory V5/MT</strong> (Motion Aftereffect) indukuje chwilową deprywację sensoryczną.</p>
                <p>Sesja synchronizuje Twoje półkule za pomocą dudnień binauralnych w zakresie <strong>4.5Hz (Theta)</strong>, co sprzyja głębokiej introspekcji i neuroplastyczności.</p>
            </div>
            <button onclick="changeScreen('welcome', 'pre-survey')" class="btn-action">Rozpocznij proces</button>
            <div class="sci-label mt-8">Benson (1975) | Jirakittayakorn (2017) | Taylor (2006)</div>
        </div>
    </div>

    <!-- 2. ANKIETA PRZED -->
    <div id="screen-pre-survey" class="screen hidden">
        <div class="glass p-10 text-center">
            <h2 class="text-2xl font-bold mb-8">Jak oceniasz swój obecny poziom napięcia?</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10">
                <div class="option-card" onclick="setSurvey('pre', 'Bardzo wysoki stres')">Bardzo wysoki stres</div>
                <div class="option-card" onclick="setSurvey('pre', 'Napięcie i zmęczenie')">Napięcie i zmęczenie</div>
                <div class="option-card" onclick="setSurvey('pre', 'Neutralnie')">Neutralnie</div>
                <div class="option-card" onclick="setSurvey('pre', 'Lekki spokój')">Lekki spokój</div>
            </div>
            <button id="btn-pre-survey" onclick="checkAndNext('pre-survey', 'instructions')" class="btn-action opacity-50 cursor-not-allowed">Dalej</button>
        </div>
    </div>

    <!-- 3. FAZA INDUKCJI (30S) -->
    <div id="screen-instructions" class="screen hidden">
        <div class="glass p-10 text-center border border-purple-500/30">
            <h2 id="ins-main" class="text-3xl font-light uppercase tracking-tighter mb-4">Uspokój oddech...</h2>
            <p id="ins-sub" class="text-purple-400 text-xs uppercase tracking-[0.3em] font-bold">Krok 1: Wdech nosem (4s)</p>
            <div id="progress-container"><div id="progress-fill"></div></div>
            <div class="mt-10 text-[10px] text-gray-500 uppercase tracking-widest leading-loose">
                Skup wzrok na pulsującym szczycie.<br>Podążaj oczami za ruchem anatomicznego wahadła.
            </div>
        </div>
    </div>

    <!-- 4. ANKIETA PO SESJI -->
    <div id="screen-post-survey" class="screen hidden">
        <div class="glass p-10 text-center">
            <h2 class="text-2xl font-bold mb-2">Sesja zakończona</h2>
            <p class="text-xs text-purple-400 mb-8 uppercase tracking-widest italic">Poczuj stabilizację układu nerwowego</p>
            <h3 class="text-lg font-semibold mb-6 text-gray-300">Jak czujesz się w tej chwili?</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                <div class="option-card" onclick="setSurvey('post', 'Głębokie odprężenie')">Głębokie odprężenie</div>
                <div class="option-card" onclick="setSurvey('post', 'Oczyszczenie myśli')">Oczyszczenie myśli</div>
                <div class="option-card" onclick="setSurvey('post', 'Lekka senność')">Lekka senność</div>
                <div class="option-card" onclick="setSurvey('post', 'Bez zmian')">Bez zmian</div>
            </div>
            <button id="btn-post-survey" onclick="checkAndNext('post-survey', 'summary')" class="btn-action opacity-50 cursor-not-allowed">Zakończ</button>
        </div>
    </div>

    <!-- 5. PODSUMOWANIE AI -->
    <div id="screen-summary" class="screen hidden">
        <div class="glass p-10 text-center border border-purple-500/20">
            <h2 class="text-4xl font-black italic mb-6">Analiza</h2>
            <div id="ai-text" class="bg-purple-900/10 p-6 rounded-2xl mb-10 border border-purple-500/10 italic text-sm text-purple-200 leading-relaxed min-h-[100px] flex items-center justify-center">
                AI generuje podsumowanie Twojej transformacji...
            </div>
            <button onclick="location.reload()" class="btn-action">Wróć do początku</button>
            <div class="sci-label mt-8">Dziękujemy za dbaniu o swój dobrostan.</div>
        </div>
    </div>

    <div id="session-exit">
        <button onclick="finishSession()" class="bg-black/40 hover:bg-black border border-white/20 px-10 py-3 rounded-full text-[10px] uppercase tracking-widest font-bold backdrop-blur-md transition-all">Zakończ Sesję</button>
    </div>

    <script>
        // --- KONFIGURACJA RENDEROWANIA ---
        const canvas = document.getElementById('hypnoCanvas');
        const ctx = canvas.getContext('2d');
        let sessionActive = false, introActive = false, time = 0, swing = 0;
        let audioCtx, nodes = [];
        let preValue = '', postValue = '';

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- RENDERER: SPIRALA I ANATOMIA ---
        function drawSpiral(cx, cy) {
            const bands = 45, maxR = Math.max(canvas.width, canvas.height) * 1.5;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.22);
            for (let i = bands; i > 0; i--) {
                const r = (i * (maxR / bands) + (time * 120)) % maxR;
                ctx.beginPath();
                ctx.arc(0, 0, Math.abs(r), 0, Math.PI * 2);
                ctx.strokeStyle = i % 2 === 0 ? "#fff" : "#000";
                ctx.lineWidth = (maxR / bands) * 0.9;
                ctx.stroke();
            }
            ctx.restore();
            time += (sessionActive && !introActive) ? 0.035 : 0.008;
        }

        function drawPendulum(cx, cy) {
            const len = 320, amp = Math.PI / 4;
            const angle = Math.sin(swing) * amp;
            if (sessionActive && !introActive) swing += 0.042;

            ctx.save();
            ctx.translate(cx, cy);

            // NASADA (REALISTYCZNA)
            const drawBase = (ox, oy) => {
                const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, 72);
                g.addColorStop(0, "#fce4d6"); // Highlight
                g.addColorStop(0.4, "#d08b74"); // Mid
                g.addColorStop(0.85, "#8d5543"); // Shadow
                g.addColorStop(1, "#050505");
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, 65, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 0.5; ctx.stroke();
            };
            drawBase(-55, 20); drawBase(55, 20);

            // WAHADŁO (TRZON I ŻOŁĄDŹ)
            ctx.rotate(angle);
            const shaftG = ctx.createLinearGradient(-45, 0, 45, 0);
            shaftG.addColorStop(0, "#8d5543"); shaftG.addColorStop(0.25, "#d08b74"); 
            shaftG.addColorStop(0.5, "#fce4d6"); // Błysk centralny
            shaftG.addColorStop(0.75, "#d08b74"); shaftG.addColorStop(1, "#8d5543");
            
            ctx.fillStyle = shaftG; 
            ctx.beginPath(); 
            ctx.roundRect(-42, -len, 84, len, [35, 35, 0, 0]); 
            ctx.fill();

            // Żyły (Vascular detail)
            ctx.beginPath(); ctx.moveTo(-18, -60); ctx.bezierCurveTo(-35, -145, 25, -200, 12, -280);
            ctx.strokeStyle = "rgba(110, 60, 180, 0.16)"; ctx.lineWidth = 3; ctx.stroke();

            // Żołądź (Realistic glans)
            const glansG = ctx.createRadialGradient(0, -len - 18, 10, 0, -len - 18, 70);
            glansG.addColorStop(0, "#e894a4"); glansG.addColorStop(0.5, "#c46a80"); glansG.addColorStop(1, "#3b1622");
            ctx.fillStyle = glansG; ctx.beginPath(); ctx.ellipse(0, -len - 12, 60, 72, 0, 0, Math.PI * 2); ctx.fill();

            // Punkt fiksacji na szczycie
            if (sessionActive && !introActive) {
                const p = (Math.sin(time * 15) + 1) * 4;
                ctx.beginPath(); ctx.arc(0, -len - 45, 6 + p, 0, Math.PI * 2);
                ctx.fillStyle = "#fff"; ctx.shadowBlur = 40; ctx.shadowColor = "#a78bfa"; ctx.fill();
            }
            ctx.restore();
        }

        function animationLoop() {
            const cx = canvas.width / 2, cy = canvas.height / 2;
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawSpiral(cx, cy);
            
            const v = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(cx, cy));
            v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.92)");
            ctx.fillStyle = v; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawPendulum(cx, cy);
            requestAnimationFrame(animationLoop);
        }
        animationLoop();

        // --- SYSTEM AUDIO (BINAURAL 4.5HZ) ---
        async function manageAudio(start) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            if (start) {
                const master = audioCtx.createGain(); master.connect(audioCtx.destination);
                master.gain.setValueAtTime(0, audioCtx.currentTime); master.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 5);
                const osc = (f, p, v) => {
                    const o = audioCtx.createOscillator(); const pn = audioCtx.createPanner(); const g = audioCtx.createGain();
                    pn.setPosition(p, 0, 0); o.frequency.value = f; g.gain.value = v;
                    o.connect(pn); pn.connect(g); g.connect(master); o.start(); nodes.push(o, g);
                };
                osc(115, -1, 0.8); osc(119.5, 1, 0.8); osc(55, 0, 0.5); nodes.push(master);
            } else {
                nodes.forEach(n => {
                    if (n instanceof OscillatorNode) { n.stop(); }
                    else if (n instanceof GainNode) { n.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5); }
                });
                nodes = [];
            }
        }

        // --- LOGIKA PRZEPŁYWU ---
        function changeScreen(from, to) {
            document.getElementById('screen-' + from).classList.add('hidden');
            document.getElementById('screen-' + to).classList.remove('hidden');
            if (to === 'instructions') startInduction();
        }

        function setSurvey(type, value) {
            if (type === 'pre') { preValue = value; document.getElementById('btn-pre-survey').classList.remove('opacity-50', 'cursor-not-allowed'); }
            else { postValue = value; document.getElementById('btn-post-survey').classList.remove('opacity-50', 'cursor-not-allowed'); }
            
            // Mark selection
            const btn = event.currentTarget;
            [...btn.parentElement.children].forEach(c => c.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function checkAndNext(screen, next) {
            changeScreen(screen.replace('screen-',''), next);
        }

        async function startInduction() {
            introActive = true;
            sessionActive = true;
            manageAudio(true);
            
            const bar = document.getElementById('progress-fill');
            const main = document.getElementById('ins-main');
            const sub = document.getElementById('ins-sub');
            const steps = [
                { m: "Wdech nosem... wydech ustami...", s: "Krok 1: Inicjacja oddechowa" },
                { m: "Zafiksuj wzrok na wierzchołku...", s: "Krok 2: Fiksacja wizualna" },
                { m: "Podążaj wzrokiem za ruchem Dicking...", s: "Krok 3: Synchronizacja" },
                { m: "Twoje otoczenie przestaje istnieć...", s: "Krok 4: Wejście w trans" }
            ];

            let p = 0;
            const interval = setInterval(() => {
                p += (1/30) * 100; bar.style.width = p + '%';
                const idx = Math.floor((p/100) * steps.length);
                if (steps[idx]) { main.innerText = steps[idx].m; sub.innerText = steps[idx].s; }
                if (p >= 100) { 
                    clearInterval(interval); 
                    document.getElementById('screen-instructions').classList.add('hidden');
                    introActive = false;
                    document.getElementById('session-exit').style.opacity = '1';
                    document.getElementById('session-exit').style.pointerEvents = 'auto';
                }
            }, 1000);
        }

        function finishSession() {
            sessionActive = false;
            manageAudio(false);
            document.getElementById('session-exit').style.opacity = '0';
            document.getElementById('session-exit').style.pointerEvents = 'none';
            document.getElementById('screen-post-survey').classList.remove('hidden');
        }

        // Gemini AI Integration for Summary
        async function fetchAISummary() {
            const aiDisplay = document.getElementById('ai-text');
            const apiKey = ""; // Klucz dostarczany przez środowisko
            
            const prompt = `Użytkownik przed sesją hipnozy Dicking (fiksacja wzroku + fale Theta) czuł: ${preValue}. Po sesji czuje: ${postValue}. Napisz krótkie (max 25 słów), empiryczne podsumowanie tej zmiany nastroju w kontekście neurobiologii.`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "Jesteś ekspertem neurobiologii i hipnoterapii klinicznej." }] }
            };

            const callWithRetry = async (retries = 5, delay = 1000) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error();
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    if (retries > 0) { await new Promise(r => setTimeout(r, delay)); return callWithRetry(retries - 1, delay * 2); }
                    throw e;
                }
            };

            try {
                const text = await callWithRetry();
                aiDisplay.innerText = text;
            } catch (err) {
                aiDisplay.innerText = `Twoja transformacja z stanu "${preValue}" do "${postValue}" wskazuje na skuteczną aktywację przywspółczulnego układu nerwowego i wejście w stan regeneracyjnej koherencji.`;
            }
        }

        // Hook into final screen
        const originalNext = checkAndNext;
        window.checkAndNext = (screen, next) => {
            if (next === 'summary') fetchAISummary();
            originalNext(screen, next);
        };
    </script>
</body>
</html>
